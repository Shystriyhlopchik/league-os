@if (activeTournament(); as tournament) {
    <app-matches-slider [seasonId]="tournament.season.id" />
}

<div class="home__body">
    <div class="home__section">
        <app-advertising-banner />
        <h2>Новости</h2>
        <app-news-preview [limit]="3" />
        <div class="home__static-header">
            <h2>Статистика</h2>
            @if (groups().length) {
                <app-select
                    [size]="'large'"
                    [options]="groups()"
                    [placeholder]="''"
                    [value]="selectedGroupId()"
                    (valueChange)="selectedGroupId.set($event)"
                />
            }
        </div>
        <div class="home__statistics">
            @if (activeTournament(); as tournament) {
                <app-stats-summary
                    [tournamentId]="tournament.id"
                    [groupId]="selectedGroupId()"
                    [title]="statsTitle()"
                />
                <app-statistics-preview
                    [tournamentId]="tournament.id"
                    [groupId]="selectedGroupId()"
                />
            }
        </div>
        <app-teams-map />
    </div>
</div>
