<div class="dashboard-page">
    <section class="dashboard-page__content">
        <p class="dashboard-page__name">Лига ОС</p>

        <p class="dashboard-page__status">
            {{ user()?.lastName }} {{ user()?.firstName }}, вы вошли в систему
        </p>

        <app-info-card
            title="Кабинет администратора"
            label="Выберите действие"
            description="Управление командами, судьями и матчами"
        ></app-info-card>

        <div class="dashboard-page__actions">
            @for (action of availableActions(); track action.route) {
                <a class="dashboard-page__action" [routerLink]="action.route">
                    <span class="dashboard-page__action-content">
                        <strong [style.color]="action.variant">{{
                            action.title
                        }}</strong>
                        <small>{{ action.description }}</small>
                    </span>

                    <span class="dashboard-page__action-arrow">›</span>
                </a>
            }
        </div>

        <button class="dashboard-page__logout" type="button" (click)="logout()">
            Выйти
        </button>
    </section>
</div>
