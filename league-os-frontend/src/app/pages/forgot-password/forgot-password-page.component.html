<main class="password-page">
    <section class="password-page__card">
        <img
            class="password-page__logo"
            src="images/logo/dvor-liga.png"
            alt="Арман Лига"
        />

        <h1 class="password-page__title">Восстановление пароля</h1>
        <p class="password-page__description">
            Укажите email аккаунта. Мы отправим ссылку для установки нового
            пароля.
        </p>

        <form
            class="password-page__form"
            [formGroup]="form"
            (ngSubmit)="submit()"
        >
            <label class="password-page__field">
                <span>Email</span>
                <input
                    type="email"
                    formControlName="email"
                    autocomplete="email"
                />
            </label>

            @if (form.controls.email.touched && form.controls.email.invalid) {
                <p class="password-page__error">Введите корректный email</p>
            }

            @if (message()) {
                <p class="password-page__success">{{ message() }}</p>
            }

            @if (error()) {
                <p class="password-page__error">{{ error() }}</p>
            }

            <button
                class="password-page__submit"
                type="submit"
                [disabled]="isLoading()"
            >
                {{ isLoading() ? "Отправляем..." : "Получить ссылку" }}
            </button>
        </form>

        <a class="password-page__back" routerLink="/login">
            Вернуться ко входу
        </a>
    </section>
</main>
