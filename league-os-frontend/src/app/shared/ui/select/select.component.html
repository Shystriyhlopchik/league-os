<div
    class="select-field"
    [class.select-field--large]="size() === 'large'"
    [class.select-field--small]="size() === 'small'"
    [class.select-field--error]="error()"
    [class.select-field--disabled]="isDisabled()"
>
    @if (label()) {
        <label class="select-field__label" [for]="selectId()">
            {{ label() }}
        </label>
    }

    <div class="select-field__control">
        <button
            #trigger
            class="select-field__trigger"
            type="button"
            role="combobox"
            aria-haspopup="listbox"
            [id]="selectId()"
            [disabled]="isDisabled()"
            [attr.aria-label]="ariaLabel() || label() || placeholder()"
            [attr.aria-expanded]="isOpen()"
            [attr.aria-required]="required()"
            [attr.aria-controls]="selectId() + '-listbox'"
            [attr.aria-activedescendant]="
                isOpen() && activeIndex() >= 0 ? optionId(activeIndex()) : null
            "
            [attr.aria-invalid]="error() ? true : null"
            [attr.aria-describedby]="
                error() || hint() ? selectId() + '-message' : null
            "
            (click)="toggle()"
            (keydown)="handleKeydown($event)"
            (blur)="markAsTouched()"
        >
            <span class="select-field__value">{{ displayLabel() }}</span>
            <span class="select-field__chevron" aria-hidden="true"></span>
        </button>

        @if (isOpen()) {
            <div
                class="select-field__menu"
                role="listbox"
                [id]="selectId() + '-listbox'"
                [attr.aria-label]="ariaLabel() || label() || placeholder()"
            >
                @for (
                    option of options();
                    track option.value;
                    let index = $index
                ) {
                    <button
                        class="select-field__option"
                        type="button"
                        role="option"
                        tabindex="-1"
                        [id]="optionId(index)"
                        [disabled]="option.disabled"
                        [class.select-field__option--active]="
                            activeIndex() === index
                        "
                        [attr.aria-selected]="option.value === selectedValue()"
                        (click)="selectOption(option)"
                    >
                        {{ option.label }}
                    </button>
                }
            </div>
        }
    </div>

    @if (error() || hint()) {
        <span
            class="select-field__message"
            [class.select-field__message--error]="error()"
            [id]="selectId() + '-message'"
        >
            {{ error() || hint() }}
        </span>
    }
</div>
