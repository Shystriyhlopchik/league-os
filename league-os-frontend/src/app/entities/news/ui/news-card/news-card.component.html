<a
    class="news-card"
    [class.news-card--large]="variant() === 'large'"
    [routerLink]="['/news', news().slug]"
>
    @if (hasImage()) {
        <img
            class="news-card__image"
            [src]="news().imageUrl"
            [alt]="news().imageAlt ?? news().title"
            (error)="failedImage.set(news().imageUrl)"
        />
    } @else {
        <div class="news-card__image news-card__placeholder" aria-hidden="true">
            <img src="brand/logos/stacked_white.svg" alt="" />
        </div>
    }

    <div class="news-card__content">
        <h3 class="news-card__title">
            {{ news().title }}
        </h3>

        <time class="news-card__date">
            {{ news().publishedAt | date: "d MMMM y" }}
        </time>
    </div>
</a>
