<article class="match-card">
    <header class="match-card__header">
        <div class="match-card__season">
            <img
                [src]="match().competitionLogoUrl"
                [alt]="match().competitionName"
            />
            <span>Сезон {{ match().seasonYear }}, {{ match().round }}</span>
        </div>

        <time class="match-card__date">
            {{ match().matchDateTime | date: 'd MMMM, HH:mm' }}
        </time>
    </header>

    <div class="match-card__content">
        <div class="match-card__team">
            <img
                class="match-card__logo"
                [src]="match().homeTeamLogoUrl"
                [alt]="'Логотип команды ' + match().homeTeamName"
            />

            <span class="match-card__team-name">
                {{ match().homeTeamName }}
            </span>
        </div>

        <div class="match-card__center">
            <strong class="match-card__score">
                {{ match().homeTeamScore ?? " - " }} :
                {{ match().awayTeamScore ?? " - " }}
            </strong>

            <span class="match-card__status">
                матч<br />
                окончен
            </span>
        </div>

        <div class="match-card__team">
            <img
                class="match-card__logo"
                [src]="match().awayTeamLogoUrl"
                [alt]="'Логотип команды ' + match().awayTeamName"
            />

            <span class="match-card__team-name">
                {{ match().awayTeamName }}
            </span>
        </div>
    </div>

    <footer class="match-card__venue">
        {{ match().venueName }}
    </footer>
</article>
