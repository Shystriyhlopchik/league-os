<section
    class="news-preview"
    [class.news-preview--page]="variant() === 'page'"
>
    <h1 class="news-preview__title">
        {{ title() }}
    </h1>

    @if (isLoading()) {
        <div class="news-preview__empty">Загрузка новостей...</div>
    } @else if (error()) {
        <div class="news-preview__empty">{{ error() }}</div>
    } @else if (isEmpty()) {
        <div class="news-preview__empty">Новостей пока нет.</div>
    } @else {
        <div class="news-preview__grid">
            @for (item of news(); track item.id; let first = $first) {
                <app-news-card
                    [news]="item"
                    [variant]="first ? 'large' : 'small'"
                />
            }
        </div>

        @if (variant() === 'page') {
            <button
                class="news-preview__more"
                type="button"
                [disabled]="isLoading()"
                (click)="loadMore()"
            >
                {{ isLoading() ? 'Загрузка...' : 'Показать ещё' }}
            </button>
        }
    }
</section>
