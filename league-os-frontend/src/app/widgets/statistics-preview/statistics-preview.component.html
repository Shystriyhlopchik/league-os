<section class="statistics-preview">
    <h2 class="statistics-preview__title">Статистика</h2>

    <app-competition-tabs
        [competitions]="competitions()"
        [selectedId]="selectedCompetitionId()"
        (selected)="selectCompetition($event)"
    />

    <app-standings-table [rows]="rows()" />

    <a class="statistics-preview__link" routerLink="/statistics">
        Вся таблица
        <span aria-hidden="true">›</span>
    </a>
</section>
