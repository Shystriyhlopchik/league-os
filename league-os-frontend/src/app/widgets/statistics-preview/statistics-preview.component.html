<section class="statistics-preview">
    <app-section-title>Турнир</app-section-title>

    @if (selectedTournamentId(); as tournamentId) {
        @if (tournaments().length > 1) {
            <app-competition-tabs
                [tournaments]="tournaments()"
                [selectedId]="tournamentId"
                (selected)="selectCompetition($event)"
            />
        }

        <app-tournament-public-view
            [tournamentId]="tournamentId"
            [compact]="true"
        />

        <a
            class="statistics-preview__link"
            [routerLink]="['/tournaments', tournamentId]"
        >
            <app-slanted-link>Открыть турнир</app-slanted-link>
        </a>
    } @else {
        <p class="statistics-preview__empty">
            Активный турнир пока не опубликован.
        </p>
    }
</section>
