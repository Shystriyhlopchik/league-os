<header class="header">
    <div class="header__inner">
        <a
            class="header__logo"
            routerLink="/"
            aria-label="Дворовая лига — главная"
        >
            <img
                class="header__logo-image"
                src="brand/logos/horizontal_white.svg"
                alt="Дворовая Лига"
            />
        </a>

        <nav
            class="header__nav header__nav--desktop"
            aria-label="Основная навигация"
        >
            <a
                class="header__nav-link"
                routerLinkActive="header__nav-link--active"
                ariaCurrentWhenActive="page"
                [routerLinkActiveOptions]="{ exact: true }"
                routerLink="/team"
                (click)="closeMenu()"
            >
                Команды
            </a>
            <a
                class="header__nav-link"
                routerLinkActive="header__nav-link--active"
                ariaCurrentWhenActive="page"
                [routerLinkActiveOptions]="{ exact: true }"
                routerLink="/players"
                (click)="closeMenu()"
            >
                Игроки
            </a>
            <a
                class="header__nav-link"
                routerLinkActive="header__nav-link--active"
                ariaCurrentWhenActive="page"
                [routerLinkActiveOptions]="{ exact: true }"
                routerLink="/matches"
                (click)="closeMenu()"
            >
                Матчи
            </a>
            <a
                class="header__nav-link"
                routerLinkActive="header__nav-link--active"
                ariaCurrentWhenActive="page"
                [routerLinkActiveOptions]="{ exact: true }"
                routerLink="/statistics"
                (click)="closeMenu()"
            >
                Таблица
            </a>
            <a
                class="header__nav-link"
                routerLinkActive="header__nav-link--active"
                ariaCurrentWhenActive="page"
                [routerLinkActiveOptions]="{ exact: true }"
                routerLink="/ranking"
                (click)="closeMenu()"
            >
                Рейтинг
            </a>
            <a
                class="header__nav-link"
                routerLinkActive="header__nav-link--active"
                ariaCurrentWhenActive="page"
                [routerLinkActiveOptions]="{ exact: true }"
                routerLink="/champion"
                (click)="closeMenu()"
            >
                Чемпион
            </a>
            <a
                class="header__nav-link"
                routerLinkActive="header__nav-link--active"
                ariaCurrentWhenActive="page"
                [routerLinkActiveOptions]="{ exact: true }"
                routerLink="/news"
                (click)="closeMenu()"
            >
                Новости
            </a>
            <ng-container
                [ngTemplateOutlet]="aboutMenu"
                [ngTemplateOutletContext]="{ id: 'desktop' }"
            />
        </nav>

        <div class="header__actions">
            <div class="header__socials" aria-label="Социальные сети">
                <a
                    class="header__social-link"
                    href="https://vk.ru/liga_dvora_cheb"
                    aria-label="ВКонтакте"
                >
                    <img
                        class="header__social-icon"
                        src="images/VK.png"
                        alt=""
                    />
                </a>
                <!--                <a-->
                <!--                    class="header__social-link"-->
                <!--                    href="https://t.me/ArmanLiga"-->
                <!--                    aria-label="Telegram"-->
                <!--                >-->
                <!--                    <img-->
                <!--                        class="header__social-icon"-->
                <!--                        src="images/telegram.png"-->
                <!--                        alt=""-->
                <!--                    />-->
                <!--                </a>-->
                <!--                <a-->
                <!--                    class="header__social-link"-->
                <!--                    href="https://max.ru/join/2pBzTFTbrv1mc6L4flPIxiKCrurt3P3SUVxCU7BeIfc"-->
                <!--                    aria-label="Instagram"-->
                <!--                >-->
                <!--                    <img-->
                <!--                        class="header__social-icon header__social-icon&#45;&#45;sm"-->
                <!--                        src="images/Max_logo_black.svg"-->
                <!--                        alt=""-->
                <!--                    />-->
                <!--                </a>-->
            </div>

            <a
                class="header__action header__action--authorization"
                [routerLink]="'/login'"
                aria-label="Личный кабинет"
            >
                <img
                    class="header__authorization-icon"
                    src="images/icons/authorization.svg"
                    alt=""
                />
                <span>Кабинет</span>
            </a>

            <button
                class="header__action header__action--menu"
                [class.header__action--menu-open]="isMenuOpen()"
                type="button"
                [attr.aria-label]="menuIconLabel()"
                [attr.aria-expanded]="isMenuOpen()"
                aria-controls="header-menu"
                (click)="toggleMenu()"
            >
                <span class="header__menu-line"></span>
                <span class="header__menu-line"></span>
                <span class="header__menu-line"></span>
            </button>
        </div>
    </div>

    @if (isMenuOpen()) {
        <nav
            id="header-menu"
            class="header__nav header__nav--mobile"
            aria-label="Мобильная навигация"
        >
            <a
                class="header__nav-link"
                routerLinkActive="header__nav-link--active"
                ariaCurrentWhenActive="page"
                [routerLinkActiveOptions]="{ exact: true }"
                routerLink="/"
                (click)="closeMenu()"
                >Главная</a
            >
            <a
                class="header__nav-link"
                routerLinkActive="header__nav-link--active"
                ariaCurrentWhenActive="page"
                [routerLinkActiveOptions]="{ exact: true }"
                routerLink="/team"
                (click)="closeMenu()"
            >
                Команды
            </a>
            <a
                class="header__nav-link"
                routerLinkActive="header__nav-link--active"
                ariaCurrentWhenActive="page"
                [routerLinkActiveOptions]="{ exact: true }"
                routerLink="/players"
                (click)="closeMenu()"
            >
                Игроки
            </a>
            <a
                class="header__nav-link"
                routerLinkActive="header__nav-link--active"
                ariaCurrentWhenActive="page"
                [routerLinkActiveOptions]="{ exact: true }"
                routerLink="/matches"
                (click)="closeMenu()"
            >
                Матчи
            </a>
            <a
                class="header__nav-link"
                routerLinkActive="header__nav-link--active"
                ariaCurrentWhenActive="page"
                [routerLinkActiveOptions]="{ exact: true }"
                routerLink="/statistics"
                (click)="closeMenu()"
            >
                Таблица
            </a>
            <a
                class="header__nav-link"
                routerLinkActive="header__nav-link--active"
                ariaCurrentWhenActive="page"
                [routerLinkActiveOptions]="{ exact: true }"
                routerLink="/ranking"
                (click)="closeMenu()"
            >
                Рейтинг
            </a>
            <a
                class="header__nav-link"
                routerLinkActive="header__nav-link--active"
                ariaCurrentWhenActive="page"
                [routerLinkActiveOptions]="{ exact: true }"
                routerLink="/champion"
                (click)="closeMenu()"
            >
                Чемпион
            </a>
            <a
                class="header__nav-link"
                routerLinkActive="header__nav-link--active"
                ariaCurrentWhenActive="page"
                [routerLinkActiveOptions]="{ exact: true }"
                routerLink="/news"
                (click)="closeMenu()"
            >
                Новости
            </a>
            <ng-container
                [ngTemplateOutlet]="aboutMenu"
                [ngTemplateOutletContext]="{ id: 'mobile' }"
            />
            <a
                class="header__nav-link"
                routerLinkActive="header__nav-link--active"
                ariaCurrentWhenActive="page"
                [routerLinkActiveOptions]="{ exact: true }"
                routerLink="/login"
                (click)="closeMenu()"
            >
                Войти
            </a>
        </nav>
    }
</header>

<ng-template #aboutMenu let-id="id">
    <div
        class="header__about"
        routerLinkActive="header__about--active"
        (focusout)="onAboutFocusOut($event)"
    >
        <button
            class="header__nav-link header__about-toggle"
            type="button"
            [attr.aria-expanded]="isAboutOpen()"
            [attr.aria-controls]="'header-about-' + id"
            (click)="isAboutOpen.set(!isAboutOpen())"
        >
            О лиге
            <svg aria-hidden="true" width="12" height="12" viewBox="0 0 12 12">
                <path
                    d="m2 4 4 4 4-4"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.5"
                />
            </svg>
        </button>
        <ul
            class="header__submenu"
            [id]="'header-about-' + id"
            [hidden]="!isAboutOpen()"
            aria-label="О лиге"
        >
            @for (link of aboutLinks; track link.path) {
                <li>
                    <a
                        class="header__nav-link"
                        [routerLink]="link.path"
                        routerLinkActive="header__nav-link--active"
                        ariaCurrentWhenActive="page"
                        (click)="closeMenu()"
                        >{{ link.label }}</a
                    >
                </li>
            }
        </ul>
    </div>
</ng-template>
