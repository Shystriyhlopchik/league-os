@if (isLoading()) {
    <div class="matches-slider__empty">Загрузка матчей...</div>
} @else if (error()) {
    <div class="matches-slider__empty" role="alert">{{ error() }}</div>
} @else {
    @let matches = this.matches();
    @if (matches.length) {
        <swiper-container #swiperEl class="match-swiper" init="false">
            @for (match of matches; track match.id) {
                <swiper-slide>
                    <app-match-card
                        [match]="match"
                        (cardClick)="openProtocol($event)"
                    />
                </swiper-slide>
            }
        </swiper-container>
    } @else {
        <div class="matches-slider__empty">
            Пока нет матчей действующих турниров.
        </div>
    }
}
