<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Stylized digital territory map" color="#00A86B">
  <defs>
    <filter id="soft-glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="point-glow" x="-220%" y="-220%" width="540%" height="540%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .outer-line {
        fill: none;
        stroke: currentColor;
        stroke-width: 0;
        stroke-linecap: round;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
      }
      .outer-glow {
        fill: none;
        stroke: currentColor;
        stroke-width: 0;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: .12;
        vector-effect: non-scaling-stroke;
      }
      .settlement-core { fill: currentColor; filter: url(#point-glow); }
      .settlement-ring {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        opacity: .68;
        vector-effect: non-scaling-stroke;
      }
      .settlement-halo { fill: currentColor; opacity: .08; }
      .landmark-line {
        fill: none;
        stroke: currentColor;
        stroke-width: 3.4;
        stroke-linecap: round;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
      }
      .landmark-fill { fill: currentColor; opacity: .08; filter: url(#soft-glow); }
      .landmark-accent { fill: currentColor; filter: url(#point-glow); }
      .decorative-dot { fill: currentColor; opacity: .2; }
      .decorative-stroke {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        opacity: .24;
        vector-effect: non-scaling-stroke;
      }
    </style>
  </defs>

  <g id="outer-contour">
