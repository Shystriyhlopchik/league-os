<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="launch-title launch-description">
  <title id="launch-title">Дворовая лига стартует</title>
  <desc id="launch-description">Анонс запуска Дворовой лиги для социальных сетей. Дата старта и открытие регистрации не заявлены. Фотография из архива лиги.</desc>
  <defs>
    <style>
      @font-face { font-family: "Oswald"; src: url("{{OSWALD_DATA_URI}}") format("truetype"); font-weight: 200 700; }
      @font-face { font-family: "Manrope"; src: url("{{MANROPE_DATA_URI}}") format("truetype"); font-weight: 200 800; }
      .display { font-family: "Oswald", "Arial Narrow", sans-serif; font-weight: 700; }
      .body { font-family: "Manrope", Arial, sans-serif; font-weight: 700; }
    </style>
    <clipPath id="canvas"><rect width="1080" height="1350"/></clipPath>
    <clipPath id="photo-window"><rect x="0" y="420" width="1080" height="720"/></clipPath>
    <linearGradient id="photo-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151919" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#151919" stop-opacity="0.04"/>
      <stop offset="0.74" stop-color="#151919" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#151919" stop-opacity="0.98"/>
    </linearGradient>
  </defs>
  <g id="01-background" data-name="01 / Асфальт" clip-path="url(#canvas)">
    <rect width="1080" height="1350" fill="#151919"/>
  </g>
  <g id="02-photography" data-name="02 / Архивная фотография" clip-path="url(#photo-window)">
    <image id="league-photo" x="0" y="420" width="1080" height="720" preserveAspectRatio="xMidYMid slice" xlink:href="{{PHOTO_DATA_URI}}"/>
    <rect x="0" y="420" width="1080" height="720" fill="url(#photo-shade)"/>
  </g>
  <g id="03-brand" data-name="03 / Айдентика">
    <path d="M0 0H1080V414L0 445Z" fill="#151919"/>
    <g id="league-logo" data-name="Оригинальный логотип" transform="translate(48 40) scale(0.29)">
      {{LOGO_VECTOR}}
    </g>
    <rect x="702" y="54" width="330" height="48" fill="#D6FF3F"/>
    <text id="brand-tagline" class="body" x="867" y="85" text-anchor="middle" fill="#151919" font-size="19" letter-spacing="1">ФУТБОЛ СВОИХ</text>
    <text id="editorial-label" class="body" x="1032" y="153" text-anchor="end" fill="#A5AFA7" font-size="14" letter-spacing="2">ВСТРЕЧАЕМСЯ НА ПОЛЕ</text>
  </g>
  <g id="04-announcement" data-name="04 / Главный анонс">
    <text id="headline-yard" class="display" x="44" y="301" fill="#F0F1E9" font-size="120" letter-spacing="-1">ДВОРОВАЯ</text>
    <text id="headline-league" class="display" x="44" y="419" fill="#F0F1E9" font-size="126" letter-spacing="-1">ЛИГА</text>
    <text id="headline-side-note" class="body" x="1032" y="358" text-anchor="end" fill="#A5AFA7" font-size="22" letter-spacing="2">ТВОЙ ДВОР.</text>
    <text id="headline-side-note-2" class="body" x="1032" y="391" text-anchor="end" fill="#A5AFA7" font-size="22" letter-spacing="2">ТВОЯ ИГРА.</text>
    <path id="launch-strip" d="M0 445L1080 414V552L0 583Z" fill="#D6FF3F"/>
    <text id="headline-launch" class="display" transform="translate(47 557) rotate(-1.65)" fill="#151919" font-size="124" letter-spacing="2">СТАРТУЕТ</text>
  </g>
  <g id="05-community" data-name="05 / Призыв объединиться">
    <text id="community-heading" class="display" x="48" y="1019" fill="#F0F1E9" font-size="56" letter-spacing="0.4">СОБИРАЙ СВОИХ.</text>
    <text id="community-subtitle" class="body" x="48" y="1068" fill="#F0F1E9" font-size="22">Футбол, который начинается во дворе.</text>
  </g>
  <g id="06-website" data-name="06 / Где следить за запуском">
    <path d="M48 1169H1032" stroke="#3A433E" stroke-width="1"/>
    <text id="website-action" class="body" x="48" y="1213" fill="#A5AFA7" font-size="17" letter-spacing="2">СЛЕДИ ЗА СТАРТОМ НА САЙТЕ</text>
    <text id="website" class="display" x="45" y="1284" fill="#D6FF3F" font-size="61" letter-spacing="1">LIGA-DVORA.RU</text>
    <text id="photo-credit" class="body" x="48" y="1321" fill="#A5AFA7" font-size="11" letter-spacing="0.6">АРХИВ ДВОРОВОЙ ЛИГИ · ФОТО: IVANOV / GEOMETRIA</text>
  </g>
</svg>
