services:

  postgres:
    image: postgres:16-alpine

    container_name: league-os-postgres-dev

    restart: unless-stopped

    env_file:
      - ../../.env

    ports:
      - "5432:5432"

    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

    networks:
      - league-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  pgadmin:
    image: dpage/pgadmin4

    container_name: league-os-pgadmin-dev

    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@league-os.ru
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "5050:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    networks:
      - league-network

  backend:
    build:
      context: ../../league-os-backend
      dockerfile: Dockerfile.dev

    container_name: league-os-backend-dev

    restart: unless-stopped

    env_file:
      - ../../.env

    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      WATCHPACK_POLLING: "true"
      TSC_WATCHFILE: "DynamicPriorityPolling"
      TSC_WATCHDIRECTORY: "DynamicPriorityPolling"

    ports:
      - "4000:3000"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
       - ../../league-os-backend:/app
       - backend_node_modules:/app/node_modules
       # Keep watch output separate from host builds, inside a disposable cache.
       # Mount the parent so Nest can safely clear the nested .dev/dist folder.
       - backend_dev_cache:/app/.dev

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const req=require('http').get('http://127.0.0.1:3000/api/feature-flags',r=>process.exit(r.statusCode===200?0:1));req.on('error',()=>process.exit(1));req.setTimeout(2000,()=>{req.destroy();process.exit(1)})"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

    networks:
      - league-network


  frontend:
    build:
      context: ../../league-os-frontend
      dockerfile: Dockerfile.dev

    container_name: league-os-frontend-dev
    restart: unless-stopped

    ports:
      - "4200:4200"

    depends_on:
      - backend

    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"

    volumes:
      - ../../league-os-frontend:/app
      - frontend_node_modules:/app/node_modules

    networks:
      - league-network

volumes:
  postgres_dev_data:
  backend_node_modules:
  backend_dev_cache:
  frontend_node_modules:
  pgadmin_data:


networks:
  league-network:
    driver: bridge
